services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notesphere
      POSTGRES_USER: notesphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
